- cle: P
  titre: Premier étage — l'étage noble
  hauteur: 'env. 16 ft sous plafond (4,90 m) : le plus haut de la maison'
  intro: L'étage de réception. Kerr y place « two spacious Drawing-rooms and a connecting Ante-room » ; ici, les portes pliantes entre les trois pièces s'ouvrent ce soir en une seule enfilade. Grandes fenêtres
    et balcon sur le square.
  pieces:
  - num: P1
    nom: Salon de repos des dames
    court: Repos des dames
    cat: san
    rect:
    - 0
    - 0
    - 14
    - 24
    desc: 'Pièce attenante aux salons où les dames se recoiffent et rajustent leur toilette : coiffeuse, grands miroirs, sofa, lavabo. Un cabinet d''aisances y est ménagé. (Clin d''œil : le miroir de la
      vraie soirée.) Ce soir : c''est là que Béatrice demande qu''on l''emmène.'
  - num: P2
    nom: Palier du grand escalier
    court: Palier
    cat: cir
    rect:
    - 0
    - 24
    - 14
    - 40
    etiquette: false
    desc: Large palier d'où l'on entre dans l'antichambre. Les invités y patientent et s'y croisent.
  - num: P3
    nom: Escalier de service
    court: Esc. service
    cat: cir
    rect:
    - 0
    - 40
    - 10
    - 52
    etiquette: false
    desc: Porte dérobée, tapissée comme le mur.
  - num: P4
    nom: Galerie
    court: Galerie
    cat: cir
    rect:
    - 10
    - 40
    - 14
    - 52
    etiquette: false
    desc: Couloir qui mène à l'aile arrière et au petit salon, et que les domestiques empruntent pour rejoindre le salon de musique.
  - num: P5
    nom: Grand salon
    court: Grand salon
    cat: rec
    rect:
    - 14
    - 0
    - 36
    - 22
    desc: 'Le salon d''apparat sur le square : soieries, dorures, miroirs au-dessus de la cheminée, meubles et bibelots en abondance comme le veut le goût du temps. Trois hautes fenêtres ouvrent sur un
      balcon.'
  - num: P6
    nom: Antichambre
    court: Antichambre
    cat: rec
    rect:
    - 14
    - 22
    - 36
    - 32
    desc: 'Pièce de liaison de 10 ft de large, la largeur que Kerr juge suffisante. Tables de jeu, fauteuils. Ce soir : on y joue aux cartes et on y bavarde, à l''écart de la musique.'
  - num: P7
    nom: Salon de musique
    court: Salon de musique
    cat: rec
    rect:
    - 14
    - 32
    - 36
    - 52
    desc: 'Le cœur de la soirée : piano à queue Broadwood, chaises dorées en rangées, partitions sur un guéridon. L''acoustique est soignée. Ce soir : le duo des Perles de Londres y chante.'
  - num: P8
    nom: Jardin d'hiver
    court: Jardin d'hiver
    cat: rec
    rect:
    - 20
    - 52
    - 36
    - 66
    desc: 'Serre de fer et de verre accolée au salon de musique, suspendue au-dessus de la cour : palmiers en pots, fougères, orchidées, bancs d''osier. Chaleur humide, lumière tamisée. Le lieu classique
      des conversations à l''écart.'
  - num: P9
    nom: Passage
    court: Passage
    cat: cir
    rect:
    - 0
    - 52
    - 20
    - 56
    etiquette: false
    desc: Mène de la galerie au petit salon.
  - num: P10
    nom: Petit salon
    court: Petit salon
    cat: fam
    rect:
    - 0
    - 56
    - 20
    - 76
    desc: 'Salon intime sur le jardin, loin du bruit de la réception : cheminée, deux fauteuils face à face, bougies. Une porte vitrée donne sur le jardin d''hiver. Ce soir : la confession de Cordelia à
      Ophelia et Theodore (journal de Cordelia).'
