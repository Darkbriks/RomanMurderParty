# La maison Whitmore, Belgravia : source de vérité des plans (gen.py la lit pour produire maison_whitmore.tex).
# Unités : pieds anglais. Repère : x = largeur de façade (0 à 36, murs mitoyens), y = profondeur depuis la rue (y=0) vers le jardin.
# cat : rec (réception) · fam (famille) · srv (service) · cir (circulation) · ext (extérieur) · san (sanitaire)
# rect : [x1, y1, x2, y2] ; etiquette: false = pas de nom sur le plan.
# portes : [x, y, orientation, largeur=3, type=d] ; orientation h = mur horizontal (y constant), v = mur vertical ; type f = porte double.
# tikz_extra : TikZ brut ajouté au plan du niveau (escaliers, mobilier…).
# Les descriptions « Ce soir : … » relient une pièce à l'intrigue ; à affiner scène par scène.
niveaux:
- cle: S
  titre: Sous-sol — les offices
  hauteur: env. 11 ft sous plafond (3,35 m) ; à demi enterré, éclairé par la cour anglaise côté rue et par la cour arrière côté jardin
  intro: 'Le domaine des domestiques. On y accède depuis la rue par l''escalier de la cour anglaise (fournisseurs, domestiques), jamais par la porte d''entrée. Kerr place ici toute la vie de service : «
    Kitchen, Scullery, Pantry, and Larder; Butler''s Pantry, Bedroom, Safe […] Housekeeper''s-room, Still-room, Store-room, and Servants''-Hall ».'
  pieces:
  - num: S1
    nom: Cour anglaise (area)
    court: Cour anglaise
    cat: ext
    rect:
    - 0
    - -8
    - 36
    - 0
    desc: 'Fossé de 8 ft entre le trottoir et la façade, fermé par une grille en fer forgé. Un escalier raide y descend depuis la rue : c''est l''entrée des fournisseurs et des domestiques. Les fenêtres
      du sous-sol donnent dessus.'
  - num: S2
    nom: Caves à charbon (sous le trottoir)
    court: Caves à charbon
    cat: srv
    rect:
    - 0
    - -14
    - 36
    - -8
    desc: Trois voûtes creusées sous le trottoir. On y déverse le charbon depuis la rue par des trappes rondes en fonte. Il alimente le fourneau de la cuisine et toutes les cheminées de la maison.
  - num: S3
    nom: Office du majordome
    court: Office du majordome
    cat: srv
    rect:
    - 0
    - 0
    - 10
    - 14
    desc: 'Le poste de commandement du majordome, près de l''entrée de service pour surveiller les allées et venues. On y lave et on y range la verrerie fine et l''argenterie, et c''est là qu''on prépare
      les plateaux. Il y dort dans un lit pliant, à côté de la chambre forte, comme le veut l''usage. Ce soir : c''est ici que le verre destiné à Marcus est préparé.'
  - num: S4
    nom: Chambre forte de l'argenterie
    court: Ch. forte
    cat: srv
    rect:
    - 0
    - 14
    - 10
    - 20
    desc: Petite pièce à porte de fer, sans fenêtre, accessible seulement depuis l'office du majordome. On y garde l'argenterie de famille et les plats d'apparat.
  - num: S5
    nom: Cave à vin
    court: Cave à vin
    cat: srv
    rect:
    - 0
    - 20
    - 10
    - 34
    desc: Voûtée, fraîche, fermée à clé ; seul le majordome en détient la clé. Casiers à bouteilles, fûts de bière dans un recoin.
  - num: S6
    nom: Chambre des valets de pied
    court: Valets
    cat: srv
    rect:
    - 0
    - 34
    - 10
    - 40
    desc: Deux lits étroits pour les deux valets de pied. Kerr prévoit au sous-sol « a sleeping room for two menservants », pour que les hommes ne dorment pas sous les toits avec les servantes.
  - num: S7
    nom: Couloir de service
    court: Couloir
    cat: cir
    rect:
    - 10
    - 0
    - 14
    - 52
    etiquette: false
    desc: Long couloir dallé de pierre qui dessert tout le sous-sol, de l'entrée de service jusqu'à l'escalier de service. Mal éclairé, il sent le charbon et la cuisine.
  - num: S8
    nom: Salle des domestiques (servants' hall)
    court: Salle des domestiques
    cat: srv
    rect:
    - 14
    - 0
    - 36
    - 18
    desc: 'Grande table de bois brut où les domestiques prennent leurs repas, selon une stricte hiérarchie : le majordome préside, l''intendante en face. Un tableau de sonnettes au mur indique de quelle
      pièce on appelle.'
  - num: S9
    nom: Chambre de l'intendante
    court: Ch. de l'intendante
    cat: srv
    rect:
    - 14
    - 18
    - 26
    - 30
    desc: 'Le salon privé de Mrs. Hartwell, intendante et gouvernante en chef depuis 25 ans : fauteuil, bureau aux livres de comptes, clés de la maison. Ce soir la pièce est vide, puisqu''elle est retenue
      au manoir.'
  - num: S10
    nom: Office (still-room)
    court: Office
    cat: srv
    rect:
    - 26
    - 18
    - 36
    - 30
    desc: 'Domaine de l''intendante : confitures, conserves, thé, café, gâteaux secs. On y prépare ce qui n''est pas de la cuisine proprement dite.'
  - num: S11
    nom: Cuisine
    court: Cuisine
    cat: srv
    rect:
    - 14
    - 30
    - 36
    - 52
    desc: 'Grande pièce haute, carrelée, avec un fourneau fermé en fonte (le « range ») et sa chaudière arrière qui chauffe l''eau de la maison. Batterie de cuivre au mur, horloge des domestiques au-dessus
      de la porte. Les fenêtres donnent sur la cour arrière. Ce soir : la cuisinière et ses aides y préparent le buffet.'
  - num: S12
    nom: Escalier de service et monte-charge
    court: Esc. de service
    cat: cir
    rect:
    - 0
    - 40
    - 10
    - 52
    etiquette: false
    desc: 'Escalier étroit qui monte du sous-sol aux combles, réservé aux domestiques. Kerr y place un monte-charge : « The Back-stair has a Lift from bottom to top. » C''est par là que les plats et la
      verrerie montent vers la salle à manger.'
  - num: S13
    nom: Arrière-cuisine (scullery)
    court: Arrière-cuisine
    cat: srv
    rect:
    - 0
    - 52
    - 20
    - 62
    desc: Éviers de pierre, eau froide, vaisselle sale. Le domaine de la fille de cuisine la plus jeune.
  - num: S14
    nom: Garde-manger (larder)
    court: Garde-manger
    cat: srv
    rect:
    - 0
    - 62
    - 10
    - 76
    desc: Pièce fraîche, orientée au nord, avec étagères de pierre et garde-manger grillagé pour la viande et le gibier.
  - num: S15
    nom: Salle de nettoyage
    court: Nettoyage
    cat: srv
    rect:
    - 10
    - 62
    - 20
    - 76
    desc: On y cire les bottes, on y aiguise les couteaux et on y entretient les lampes et les becs de gaz.
  - num: S16
    nom: Cour arrière
    court: Cour arrière
    cat: ext
    rect:
    - 20
    - 52
    - 36
    - 70
    desc: Cour dallée en contrebas, au niveau du sous-sol. Elle éclaire la cuisine et l'arrière-cuisine. Quelques marches remontent vers le jardin. Le jardin d'hiver du premier étage la surplombe.
