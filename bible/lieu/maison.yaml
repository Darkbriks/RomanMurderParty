- cle: R
  titre: Rez-de-chaussée — l'accueil et le buffet
  hauteur: env. 14 ft sous plafond (4,25 m) ; surélevé de quelques marches au-dessus de la rue
  intro: L'étage qu'on traverse en arrivant. Suivant Kerr, la salle à manger est à l'arrière, « as it ought to be, if possible », et la bibliothèque, « necessarily small », donne sur la rue. Ce soir, la
    salle à manger accueille le buffet.
  pieces:
  - num: R0
    nom: Perron
    court: Perron
    cat: ext
    rect:
    - 7
    - -5
    - 13
    - 0
    etiquette: false
    desc: Quelques marches de pierre franchissent la cour anglaise jusqu'à la porte d'entrée, sous un porche à deux colonnes. Façade en stuc blanc, typique des terraces de Belgravia.
  - num: R1
    nom: Vestibule
    court: Vestib.
    cat: cir
    rect:
    - 6
    - 0
    - 14
    - 10
    desc: Sas entre la porte d'entrée et le hall. Le valet de pied y reçoit les invités et y annonce leur arrivée. Sol de marbre en damier noir et blanc.
  - num: R2
    nom: Vestiaire et lavabo des messieurs
    court: Vest.
    cat: san
    rect:
    - 0
    - 0
    - 6
    - 10
    desc: On y dépose manteaux, cannes et chapeaux haut de forme. Lavabo et cabinet d'aisances à chasse d'eau.
  - num: R3
    nom: Hall d'entrée
    court: Hall
    cat: cir
    rect:
    - 0
    - 10
    - 14
    - 24
    desc: 'Hall dallé, cheminée, banquette, porte-parapluies. Contre le mur se dresse la grande horloge de parquet : c''est elle qui donne l''heure de la maison et qui sonne les heures. Ce soir : c''est
      l''horloge que Vivienne entend.'
  - num: R4
    nom: Grand escalier
    court: Grand escalier
    cat: cir
    rect:
    - 0
    - 24
    - 14
    - 40
    etiquette: false
    desc: 'Escalier d''apparat en pierre, tapis retenu par des tringles de laiton, rampe d''acajou. Il monte jusqu''au troisième étage. Une verrière, au sommet de la cage, l''éclaire de jour. (Clin d''œil
      à la vraie soirée : la quatrième marche.)'
  - num: R5
    nom: Escalier de service
    court: Esc. service
    cat: cir
    rect:
    - 0
    - 40
    - 10
    - 52
    etiquette: false
    desc: Arrivée du monte-charge. Un domestique y réceptionne plats et verrerie avant de les porter à la salle à manger.
  - num: R6
    nom: Couloir arrière et desserte
    court: Desserte
    cat: cir
    rect:
    - 10
    - 40
    - 14
    - 52
    etiquette: false
    desc: 'Passage étroit entre l''escalier de service et la salle à manger. Une console sert d''office de desserte : on y pose les plateaux avant le service. C''est le « Service-closet for the Dining-room
      » de Kerr.'
  - num: R7
    nom: Bibliothèque
    court: Bibliothèque
    cat: fam
    rect:
    - 14
    - 0
    - 36
    - 20
    desc: 'Rayonnages d''acajou du sol au plafond, fauteuils de cuir, globe terrestre, grand bureau. C''est la pièce de Lord Whitmore quand il est à Londres. Fenêtres sur le square. (Clin d''œil à la vraie
      soirée : La Panthère des neiges cachée dans les rayons.)'
  - num: R8
    nom: Salle à manger
    court: Salle à manger
    cat: rec
    rect:
    - 14
    - 20
    - 36
    - 52
    desc: 'La plus grande pièce du rez-de-chaussée : boiseries sombres, portraits de famille, lustre au gaz. La longue table d''acajou a été poussée contre le mur et sert de buffet. Ce soir : buffet debout,
      champagne, va-et-vient permanent. C''est là que les invités se servent et que Béatrice trébuche.'
  - num: R9
    nom: Passage
    court: Passage
    cat: cir
    rect:
    - 0
    - 52
    - 20
    - 56
    etiquette: false
    desc: Relie la maison principale à l'aile arrière.
  - num: R10
    nom: Toilettes
    court: WC
    cat: san
    rect:
    - 0
    - 56
    - 10
    - 62
    desc: Cabinet d'aisances à chasse d'eau, cuvette en faïence décorée. Les modèles tout en céramique se répandent depuis l'Exposition d'hygiène de 1884.
  - num: R11
    nom: Débarras
    court: Débarras
    cat: srv
    rect:
    - 10
    - 56
    - 20
    - 62
    desc: Armoire à fusils de chasse, cannes, imperméables.
  - num: R12
    nom: Cabinet de Lord Whitmore (fumoir)
    court: Fumoir
    cat: fam
    rect:
    - 0
    - 62
    - 20
    - 76
    desc: 'Pièce d''homme sur le jardin : cuir, tabac, trophées, journaux. En l''absence de Lord Whitmore, elle sert de fumoir aux messieurs. Ce soir : on s''y retire pour fumer, loin des dames.'
  - num: R13
    nom: Cour arrière (en contrebas)
    court: Cour (vide)
    cat: ext
    rect:
    - 20
    - 52
    - 36
    - 70
    desc: Vue plongeante sur la cour du sous-sol.
