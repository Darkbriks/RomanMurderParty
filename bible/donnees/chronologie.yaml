# Chronologie maître de la soirée du 27 novembre 1890 (jets 1 et 2, plus ce que l'ouverture a fixé).
# Phases RELATIVES (P0 à P10) : leur ordre est fixé, pas leurs heures, sauf les arrivées.
# statut  decide  = décidé par Antoine
#         piste   = idée d'Antoine, à confirmer
#         propose = proposition de Claude, à valider ou rejeter
# source  ouverture = fixé par le texte déjà écrit (parties/ouverture.tex) ; le texte fait foi.
# Une case (personnage × phase) absente est un TROU à combler.
# Les ressentis des personnages ne vont pas ici mais dans ../notes-de-scene.md.

debut_reception: '21:00'
heures_absolues: non fixées, sauf les arrivées ; l'heure X sera fixée quand on verra la durée que remplissent
  les scènes
