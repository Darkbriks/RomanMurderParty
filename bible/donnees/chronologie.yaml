a_placer:
  WHI:
  - 'Obtenir son tête-à-tête avec Seraphina : quand, et y parvient-elle ?'
  EVA:
  - 'Obtenir son cœur-à-cœur avec Seraphina : quand, et y parvient-elle ?'
  SER:
  - 'Négocier avec la veuve la fin du chantage (difficile : Florence, sa mère et Evangeline la tiennent
    occupée)'
  - Retrouvailles avec Béatrice, qui l'a aidée à ses débuts
  - 'Confrontation avec Lady Whitmore : a-t-elle lieu ?'
  FLO:
  - Découvrir la nature exacte du chantage
  DOM:
  - Qui sert le second verre à Marcus ?
  THE:
  - Découvrir qui s'intéresse à ses archives
  OPH:
  - Recueillir des histoires pour son spectacle
  ISA:
  - Identifier le cerveau du réseau
  VIV:
  - Percer le mystère Prévost (objectif de fiche, toujours actif malgré l'oubli)
  MAR:
  - 'Repérer les menaces : Isadora, la photo de Theodore'
  BEA:
  - Protéger le secret de la mort de Prévost
  THO:
  - Protéger Béatrice ; ses doutes techniques sur Blackstone
  MON:
  - Ne jamais rester seule avec Reginald plus de quelques minutes
  REG:
  - S'isoler cinq minutes avec Monica
  BLA:
  - Qui interroge-t-il avant Marcus ?
  - Que fait-il de sa découverte au moment du vote ?
  LIL:
  - Maintenir les apparences de son mariage
  - Son mari vient-il ?
  VAL:
  - Confronter Seraphina, exiger un aveu public
flottants:
- quoi: Ouverture du coffret à antidote
  contrainte: Entre la lettre et le vote, avant ou après l'heure X ; le vote suppose seulement qu'il soit
    ouvert. Qui trouve le code, et où est le coffret ?
- quoi: Débrief de la bibliothèque (Cordelia, Isadora, Theodore)
  contrainte: Tout à la fin si l'antidote est détruit, une fois clair que Béatrice a bu le poison ; un
    peu après le vote s'il est donné.
- quoi: Toast à Seraphina
  contrainte: Placé avant le chant pour que Béatrice boive avant la lettre ; à confirmer avec les usages.
meteo: La neige commence à tomber le soir de la réception (ouverture).
lieux_fixes:
- Les premiers arrivés se réunissent dans la salle à manger, « bien trop étouffante ».
- La grande glace du hall vient de Venise.
