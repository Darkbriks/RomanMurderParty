# Ce que chaque personnage pense des autres au DÉBUT de la réception (état initial, canon V2.5).
# Matrice non symétrique : une entrée « de: A, vers: B » dit ce que A pense de B.
# Identifiants : voir personnages.yaml. Une paire absente = les sources ne disent rien.
#
# valence     -2 hostilité, peur, mépris · -1 méfiance, gêne · 0 neutre, intérêt, usage
#             +1 sympathie, respect · +2 affection, confiance
# ambivalent  true si la relation mêle attirance et rejet
# source      fiche   = section « Relations » de la fiche V2.5 de celui qui pense
#             indices = indices et secrets de la fiche V2.5
#             plan    = tableau « connaissances et relations (jeu) » de Plan.md (écrit pour la V2)
#             v2      = fiche MJ archivée (seule source pour Lily)
#             deduit  = lecture de Claude, à valider ou rejeter
# Le roman fera évoluer certaines relations (Marcus plus lumineux, notamment).

